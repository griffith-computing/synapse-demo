##
# Reusable Synapse workspace artifact publication stage.
# Downloads one immutable package, verifies it, publishes its contents to an
# existing workspace, and runs environment-resolved smoke tests.
##
parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: serviceConnection
    type: string
  - name: agentPool
    type: string
  - name: resourceGroupName
    type: string
  - name: subscriptionId
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: downloadMode
    type: string
    default: current
  - name: sourceBuildId
    type: string
    default: ''
  - name: pipelineResourceAlias
    type: string
    default: ''
  - name: packageVersion
    type: string
  - name: artifactName
    type: string
    default: synapse-artifacts-release

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: sequential
    variables:
      expectedPackageVersion: ${{ parameters.packageVersion }}
    jobs:
      - deployment: Publish
        displayName: ${{ parameters.displayName }}
        environment: ${{ parameters.environmentName }}
        timeoutInMinutes: 60
        variables:
          packageRoot: $(Agent.TempDirectory)\synapse-artifacts-$(Build.BuildId)-$(System.JobId)-$(System.JobAttempt)
        pool:
          name: ${{ parameters.agentPool }}
          demands:
            - Agent.OS -equals Windows_NT
            - Agent.OSArchitecture -equals X64
            - SYNAPSE_PRIVATE_AGENT -equals true
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                  clean: true

                - pwsh: |
                    if (Test-Path -LiteralPath "$(packageRoot)") { throw 'Job package directory already exists; retry as a new job attempt.' }
                    New-Item -ItemType Directory -Path "$(packageRoot)" | Out-Null
                  displayName: Create isolated package workspace

                - ${{ if eq(parameters.downloadMode, 'current') }}:
                    - task: DownloadPipelineArtifact@2
                      displayName: Download Synapse artifact package (current run)
                      inputs:
                        source: current
                        artifact: ${{ parameters.artifactName }}
                        path: $(packageRoot)\download

                - ${{ if eq(parameters.downloadMode, 'specific') }}:
                    - task: DownloadPipelineArtifact@2
                      displayName: Download Synapse artifact package (prior run)
                      inputs:
                        source: specific
                        project: $(System.TeamProject)
                        pipeline: ${{ parameters.pipelineResourceAlias }}
                        runVersion: specific
                        runId: ${{ parameters.sourceBuildId }}
                        artifact: ${{ parameters.artifactName }}
                        path: $(packageRoot)\download

                - task: PowerShell@2
                  displayName: Select and expand artifact package
                  inputs:
                    targetType: filePath
                    filePath: $(Build.SourcesDirectory)\scripts\Expand-SynapsePipelinePackage.ps1
                    arguments: >-
                      -PackageDirectory "$(packageRoot)\download"
                      -DestinationDirectory "$(packageRoot)\extracted"
                      -ExpectedVersion "$(expectedPackageVersion)"
                    pwsh: true

                - task: PowerShell@2
                  displayName: Verify artifact package integrity
                  inputs:
                    targetType: filePath
                    filePath: $(Build.SourcesDirectory)\scripts\Test-SynapseRepository.ps1
                    arguments: >-
                      -RepositoryRoot "$(Build.SourcesDirectory)"
                      -ArtifactManifestPath "$(manifestPath)"
                      -ArtifactBasePath "$(packageRoot)\extracted"
                      -Offline
                    pwsh: true

                - task: AzureCLI@2
                  displayName: Resolve workspace publication endpoints
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      & "$(Build.SourcesDirectory)\scripts\Get-SynapseDeploymentOutputs.ps1" `
                        -ResourceGroupName "${{ parameters.resourceGroupName }}" `
                        -DeploymentName "synapse-${{ parameters.environmentName }}" `
                        -SubscriptionId "${{ parameters.subscriptionId }}"
                    addSpnToEnvironment: true

                - task: AzureCLI@2
                  displayName: Verify environment private path
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Test-RunnerPrivateConnectivity.ps1
                    arguments: >-
                      -StorageAccountName "$(storageAccountName)"
                      -WorkspaceName "$(synapseWorkspaceName)"

                - task: AzureCLI@2
                  displayName: Seed raw sample data
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage fs file upload `
                        --account-name "$(storageAccountName)" `
                        --file-system raw `
                        --path "sample/sample_customers.csv" `
                        --source "$(packageRoot)\extracted\sample\raw\sample_customers.csv" `
                        --auth-mode login `
                        --overwrite true `
                        --only-show-errors
                      if ($LASTEXITCODE -ne 0) { throw "Failed to seed raw sample data." }
                    addSpnToEnvironment: true

                - task: AzureCLI@2
                  displayName: Publish Synapse workspace artifacts
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Publish-SynapseArtifacts.ps1
                    arguments: >-
                      -ArtifactsRoot "$(packageRoot)\extracted\synapse"
                      -ConfigFile "$(packageRoot)\extracted\config\${{ parameters.environmentName }}.json"
                      -WorkspaceName "$(synapseWorkspaceName)"
                      -SubscriptionId "${{ parameters.subscriptionId }}"
                      -TokenValues "STORAGE_ACCOUNT_DFS_ENDPOINT=$(storageAccountDfsEndpoint)"
                    addSpnToEnvironment: true

                - task: AzureCLI@2
                  displayName: Run resolved Synapse smoke tests
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $definitions = Get-Content "$(Build.SourcesDirectory)\tests\fixtures\smoke-tests.sample.json" -Raw | ConvertFrom-Json
                      foreach ($definition in $definitions) {
                        if ($definition.Type -eq 'AzCommand') {
                          for ($index = 0; $index -lt $definition.Command.Count; $index++) {
                            if ($definition.Command[$index] -eq 'synws') { $definition.Command[$index] = '$(synapseWorkspaceName)' }
                            if ($definition.Command[$index] -eq 'sample-pipeline') { $definition.Command[$index] = 'PL_CopyRawToCurated' }
                          }
                        }
                        if ($definition.Type -eq 'HttpCheck') { $definition.Url = '$(synapseWebEndpoint)' }
                      }
                      $resolvedPath = "$(packageRoot)\synapse-smoke-tests.json"
                      $definitions | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $resolvedPath -Encoding UTF8
                      & "$(Build.SourcesDirectory)\scripts\Invoke-SynapseSmokeTests.ps1" -TestDefinitionsPath $resolvedPath
                      if ($LASTEXITCODE -ne 0) { throw "One or more Synapse smoke tests failed." }
                    addSpnToEnvironment: true

                - pwsh: |
                    if (Test-Path -LiteralPath "$(packageRoot)") { Remove-Item -LiteralPath "$(packageRoot)" -Recurse -Force }
                  displayName: Clean job package workspace
                  condition: always()