##
# Build-once, promote-everywhere deployment pipeline for the Synapse PoC
# infra (Bicep) templates.
#
# Hosted "Bootstrap" provisions/verifies the private Windows ADO agent.
# Independently, "Package" builds a single immutable, versioned release artifact
# from infra/ (scripts/New-SynapseReleasePackage.ps1). The SAME artifact
# is then promoted through Dev -> Test -> Prod after bootstrap (no rebuild) via the
# shared templates/deploy-stage.yml template, which applies each
# environment's approvals/exclusive-lock checks (configured on the Azure
# DevOps Environment resources named "dev", "test", "prod") and
# OIDC/workload identity federation sign-in.
#
# Synapse workspace artifacts are packaged and promoted independently by
# azure-pipelines/publish-artifacts.yml after infrastructure exists.
##
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - azure-pipelines/deploy.yml
      - azure-pipelines/deploy-runner.yml
      - azure-pipelines/templates/deploy-runner-stage.yml
      - azure-pipelines/templates/deploy-stage.yml
      - azure-pipelines/templates/variables.yml
      - scripts/Common.psm1
      - scripts/Deploy-SynapseWorkspace.ps1
      - scripts/Deploy-SharedRunner.ps1
      - scripts/Initialize-GitHubRunner.ps1
      - scripts/Initialize-AzureDevOpsAgent.ps1
      - scripts/Register-AzureDevOpsAgent.ps1
      - scripts/Invoke-AzureDevOpsAgentBootstrap.ps1
      - scripts/Invoke-RunnerManagedCommand.ps1
      - scripts/Set-SynapsePrivateConnectivity.ps1
      - scripts/Test-RunnerPrivateConnectivity.ps1
      - scripts/Get-SynapseDeploymentOutputs.ps1
      - scripts/New-SynapseReleasePackage.ps1
      - scripts/Expand-SynapsePipelinePackage.ps1
      - scripts/Test-SynapseRepository.ps1

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - template: templates/variables.yml

stages:
  - template: templates/deploy-runner-stage.yml
    parameters:
      serviceConnection: ${{ variables['serviceConnection.runner'] }}
      agentPool: ${{ variables.runnerPool }}

  - stage: Package
    displayName: Build immutable infra release package
    dependsOn: []
    jobs:
      - job: Package
        displayName: Package infra release
        steps:
          - checkout: self

          - pwsh: |
              $shortSha = "$(Build.SourceVersion)".Substring(0,7)
              $version = "$(Build.BuildId)-$shortSha"
              Write-Host "##vso[task.setvariable variable=releaseVersion;isOutput=true]$version"
            name: meta
            displayName: Compute release version

          - task: PowerShell@2
            displayName: Run New-SynapseReleasePackage.ps1
            inputs:
              targetType: filePath
              filePath: $(Build.SourcesDirectory)/scripts/New-SynapseReleasePackage.ps1
              arguments: >-
                -SourcePaths "$(Build.SourcesDirectory)/infra"
                -OutputDirectory "$(Build.ArtifactStagingDirectory)"
                -Version "$(meta.releaseVersion)"
                -PackageName "synapse-infra-release"
              pwsh: true

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: $(releaseArtifactName)
            displayName: Publish immutable infra release artifact

  - template: templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Dev
      displayName: Deploy - dev
      environmentName: dev
      serviceConnection: ${{ variables['serviceConnection.dev'] }}
      agentPool: ${{ variables.runnerPool }}
      resourceGroupName: $(resourceGroup.dev)
      subscriptionId: $(subscriptionId.dev)
      artifactName: $(releaseArtifactName)
      packageVersion: $[ stageDependencies.Package.Package.outputs['meta.releaseVersion'] ]
      dependsOn:
        - Package
        - Bootstrap

  - template: templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Test
      displayName: Deploy - test
      environmentName: test
      serviceConnection: ${{ variables['serviceConnection.test'] }}
      agentPool: ${{ variables.runnerPool }}
      resourceGroupName: $(resourceGroup.test)
      subscriptionId: $(subscriptionId.test)
      artifactName: $(releaseArtifactName)
      packageVersion: $[ stageDependencies.Package.Package.outputs['meta.releaseVersion'] ]
      dependsOn:
        - Package
        - Deploy_Dev

  - template: templates/deploy-stage.yml
    parameters:
      stageName: Deploy_Prod
      displayName: Deploy - prod
      environmentName: prod
      serviceConnection: ${{ variables['serviceConnection.prod'] }}
      agentPool: ${{ variables.runnerPool }}
      resourceGroupName: $(resourceGroup.prod)
      subscriptionId: $(subscriptionId.prod)
      artifactName: $(releaseArtifactName)
      packageVersion: $[ stageDependencies.Package.Package.outputs['meta.releaseVersion'] ]
      dependsOn:
        - Package
        - Deploy_Test
