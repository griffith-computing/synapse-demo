##
# Build-once, promote-everywhere deployment pipeline for the Synapse PoC
# infra (Bicep) templates.
#
# 1. package  - builds a single immutable, versioned release artifact
#               from infra/ via scripts/New-SynapseReleasePackage.ps1.
# 2. deploy-dev/test/prod - the SAME artifact is promoted through each
#               environment (no rebuild). Each stage delegates to the
#               reusable deploy-environment.yml workflow, which applies
#               that environment's required GitHub Environment approvals,
#               OIDC login, authenticated what-if, and deploy.
#
# Synapse workspace artifacts are packaged and promoted independently by
# publish-artifacts.yml after infrastructure exists.
#
# ASSUMPTION: scripts/New-SynapseReleasePackage.ps1 accepts -SourcePaths
# <path[]> -OutputDirectory <path> -Version <string> and produces a
# single immutable zip + manifest.json + checksums.sha256 at
# OutputDirectory (immutability enforced by using the workflow run
# number + short git SHA as the version, so a given artifact name is
# never reused/overwritten).
##
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-environment.yml
      - .github/workflows/deploy-runner.yml
      - scripts/Deploy-SharedRunner.ps1
      - scripts/Initialize-GitHubRunner.ps1
      - scripts/Register-GitHubRunner.ps1
      - scripts/Invoke-RunnerManagedCommand.ps1
      - scripts/Set-SynapsePrivateConnectivity.ps1
      - scripts/Test-RunnerPrivateConnectivity.ps1
      - scripts/Common.psm1
      - scripts/Deploy-SynapseWorkspace.ps1
      - scripts/New-SynapseReleasePackage.ps1
      - scripts/Test-SynapseRepository.ps1
  workflow_dispatch: {}

# Only one promotion pipeline in flight at a time; later pushes queue
# rather than cancel an in-progress promotion.
concurrency:
  group: deploy-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner:
    name: Bootstrap shared Windows runner
    uses: ./.github/workflows/deploy-runner.yml
    secrets:
      RUNNER_AZURE_CLIENT_ID: ${{ secrets.RUNNER_AZURE_CLIENT_ID }}
      RUNNER_AZURE_TENANT_ID: ${{ secrets.RUNNER_AZURE_TENANT_ID }}
      RUNNER_AZURE_SUBSCRIPTION_ID: ${{ secrets.RUNNER_AZURE_SUBSCRIPTION_ID }}
      RUNNER_ADMIN_PASSWORD: ${{ secrets.RUNNER_ADMIN_PASSWORD }}
      RUNNER_APP_PRIVATE_KEY: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
    permissions:
      id-token: write
      contents: read

  package:
    name: Build immutable infra release package
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release version
        id: meta
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0,7)
          $version = "${{ github.run_number }}-$shortSha"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "artifact-name=synapse-infra-release-$version" >> $env:GITHUB_OUTPUT

      - name: Package infra release
        shell: pwsh
        run: |
          ./scripts/New-SynapseReleasePackage.ps1 `
            -SourcePaths "${{ github.workspace }}/infra" `
            -OutputDirectory "${{ github.workspace }}/dist" `
            -Version "${{ steps.meta.outputs.version }}" `
            -PackageName "synapse-infra-release"

      - name: Publish immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: dist/**
          if-no-files-found: error
          retention-days: 90

  deploy-dev:
    name: Deploy (dev)
    needs: [package, runner]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      artifact-name: ${{ needs.package.outputs.artifact-name }}
      package-version: ${{ needs.package.outputs.version }}
    secrets:
      repository_AZURE_CLIENT_ID: ${{ secrets.dev_AZURE_CLIENT_ID }}
      repository_AZURE_TENANT_ID: ${{ secrets.dev_AZURE_TENANT_ID }}
      repository_AZURE_SUBSCRIPTION_ID: ${{ secrets.dev_AZURE_SUBSCRIPTION_ID }}
      repository_SYNAPSE_SQL_ADMIN_PASSWORD: ${{ secrets.dev_SYNAPSE_SQL_ADMIN_PASSWORD }}
    permissions:
      id-token: write
      contents: read

  deploy-test:
    name: Deploy (test)
    needs: [package, deploy-dev]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
      artifact-name: ${{ needs.package.outputs.artifact-name }}
      package-version: ${{ needs.package.outputs.version }}
    secrets:
      repository_AZURE_CLIENT_ID: ${{ secrets.test_AZURE_CLIENT_ID }}
      repository_AZURE_TENANT_ID: ${{ secrets.test_AZURE_TENANT_ID }}
      repository_AZURE_SUBSCRIPTION_ID: ${{ secrets.test_AZURE_SUBSCRIPTION_ID }}
      repository_SYNAPSE_SQL_ADMIN_PASSWORD: ${{ secrets.test_SYNAPSE_SQL_ADMIN_PASSWORD }}
    permissions:
      id-token: write
      contents: read

  deploy-prod:
    name: Deploy (prod)
    needs: [package, deploy-test]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      artifact-name: ${{ needs.package.outputs.artifact-name }}
      package-version: ${{ needs.package.outputs.version }}
    secrets:
      repository_AZURE_CLIENT_ID: ${{ secrets.prod_AZURE_CLIENT_ID }}
      repository_AZURE_TENANT_ID: ${{ secrets.prod_AZURE_TENANT_ID }}
      repository_AZURE_SUBSCRIPTION_ID: ${{ secrets.prod_AZURE_SUBSCRIPTION_ID }}
      repository_SYNAPSE_SQL_ADMIN_PASSWORD: ${{ secrets.prod_SYNAPSE_SQL_ADMIN_PASSWORD }}
    permissions:
      id-token: write
      contents: read
