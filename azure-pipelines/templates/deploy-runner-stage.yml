parameters:
  - name: serviceConnection
    type: string
  - name: agentPool
    type: string

stages:
  - stage: Bootstrap
    displayName: Bootstrap private Windows agent
    dependsOn: []
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: sequential
    jobs:
      - deployment: Bootstrap
        environment: runner
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 120
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                - task: AzureCLI@2
                  displayName: Provision and verify private Windows agent
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)/scripts/Invoke-AzureDevOpsAgentBootstrap.ps1
                    arguments: >-
                      -OrganizationUrl "$(System.CollectionUri)"
                      -PoolName "${{ parameters.agentPool }}"
                      -ResourceGroupName "$(runnerResourceGroup)"
                      -RegistrationAuth "$(runnerRegistrationAuth)"
                      -Location "$(runnerLocation)"
                      -VmSize "$(runnerVmSize)"
                      -AdminUsername "$(runnerAdminUsername)"
                      -VnetAddressPrefix "$(runnerVnetCidr)"
                      -BastionSubnetPrefix "$(runnerBastionCidr)"
                      -RunnerSubnetPrefix "$(runnerSubnetCidr)"
                      -EndpointSubnetPrefix "$(runnerEndpointCidr)"
                  env:
                    RUNNER_ADMIN_PASSWORD: $(runnerAdminPassword)
                    ADO_JOB_TOKEN: $(System.AccessToken)
                    ADO_AGENT_PAT: $(runnerRegistrationPat)
