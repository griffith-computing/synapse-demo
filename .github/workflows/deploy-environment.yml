##
# Reusable deployment/rollback workflow for a single environment
# (dev/test/prod). Called by deploy.yml (promotion) and rollback.yml
# (rollback). All deployment logic lives in scripts/ (owned by the
# scripts/ workstream) - this file only orchestrates.
#
# Flow per docs/deployment-runbook.md:
#   1. Download the immutable infra release package (built once by
#      deploy.yml's package job) and expand it.
#   2. Azure sign-in via OIDC / workload identity federation.
#   3. Authenticated Azure what-if - skipped for rollback, since rollback
#      redeploys a package that already passed what-if during its
#      original promotion run.
#   4. Deploy (or, for rollback, select + redeploy the prior package).
#   5. Finish after the infrastructure deployment succeeds. Workspace
#      artifacts and their smoke tests are owned by publish-artifacts.yml.
#
# ASSUMPTIONS on shared script interfaces (owned by scripts/, not this
# workflow):
#   Test-SynapseRepository.ps1 -ArtifactManifestPath <path> -ArtifactBasePath <path> -Offline
#   Deploy-SynapseWorkspace.ps1 -ResourceGroupName <rg> -DeploymentName <name> `
#     -TemplateFile <path> -TemplateParametersFile <path> -SubscriptionId <id> [-DryRun]
#   Invoke-SynapseRollback.ps1 -PackageDirectory <path> -TargetVersion <version>
# Azure login identifiers use environment secrets first, then the
# environment-prefixed repository secrets forwarded by the caller.
# AZURE_RESOURCE_GROUP is a GitHub variable. Workspace details come from Bicep outputs.
# Required
# approvals/reviewers for test/prod are configured on those same GitHub
# Environments per docs/deployment-runbook.md - this workflow only
# references the environment name.
#
##
name: Deploy to environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment name (dev, test, prod)
        required: true
        type: string
      artifact-name:
        description: Name of the immutable infra release artifact to deploy
        required: true
        type: string
      package-version:
        description: Release version encoded in the package (used for rollback candidate selection)
        required: true
        type: string
      is-rollback:
        description: When true, invokes Invoke-SynapseRollback.ps1 to verify/select the package instead of a fresh what-if
        required: false
        type: boolean
        default: false
    secrets:
      repository_AZURE_CLIENT_ID:
        required: false
      repository_AZURE_TENANT_ID:
        required: false
      repository_AZURE_SUBSCRIPTION_ID:
        required: false
      repository_SYNAPSE_SQL_ADMIN_PASSWORD:
        required: false

permissions:
  id-token: write # required for OIDC federation with Azure
  contents: read

concurrency:
  # Exclusive per-environment deployment: a second deploy/rollback to the
  # same environment must wait rather than run concurrently.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.is-rollback && 'Rollback' || 'Deploy' }} (${{ inputs.environment }})
    runs-on: [self-hosted, Windows, X64, synapse-private]
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.repository_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.repository_AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.repository_AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download immutable infra release package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: package

      - name: Expand release package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path package -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "No .zip package found in downloaded artifact." }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath package-extracted -Force

      - name: Verify package integrity
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path package -Filter *.manifest.json | Select-Object -First 1
          if (-not $manifest) { throw "No .manifest.json found in downloaded artifact." }
          ./scripts/Test-SynapseRepository.ps1 -RepositoryRoot "${{ github.workspace }}" -ArtifactManifestPath $manifest.FullName -ArtifactBasePath (Resolve-Path package-extracted) -Offline

      - name: Validate Azure login configuration
        shell: pwsh
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          Write-Host "Checking Azure login secrets for environment '$env:DEPLOYMENT_ENVIRONMENT' in '$env:GITHUB_REPOSITORY'."
          Write-Host "Workflow commit: $env:GITHUB_SHA; run attempt: $env:GITHUB_RUN_ATTEMPT"
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')
          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "::error::Secret '$name' is missing or empty; configure the environment secret or repository secret '${env:DEPLOYMENT_ENVIRONMENT}_$name'."
              $missing += $name
            } else {
              Write-Host "${name}: present"
            }
          }
          if ($missing.Count -gt 0) {
            throw "Azure login configuration is incomplete. Set $($missing -join ', ') as environment secrets for '$env:DEPLOYMENT_ENVIRONMENT', or as repository secrets prefixed with '${env:DEPLOYMENT_ENVIRONMENT}_' in $env:GITHUB_REPOSITORY. This workflow reads secrets, not variables."
          }

      - name: Azure login (OIDC / workload identity federation)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Select and verify rollback candidate
        if: ${{ inputs.is-rollback }}
        shell: pwsh
        run: |
          ./scripts/Invoke-SynapseRollback.ps1 `
            -PackageDirectory "${{ github.workspace }}/package" `
            -ArtifactBasePath "${{ github.workspace }}/package-extracted" `
            -TargetVersion "${{ inputs.package-version }}"

      - name: Pre-deployment what-if validation
        if: ${{ !inputs.is-rollback }}
        shell: pwsh
        run: |
          ./scripts/Deploy-SynapseWorkspace.ps1 `
            -ResourceGroupName "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -DeploymentName "synapse-${{ inputs.environment }}" `
            -TemplateFile "${{ github.workspace }}/package-extracted/infra/main.bicep" `
            -TemplateParametersFile "${{ github.workspace }}/package-extracted/infra/parameters/${{ inputs.environment }}.bicepparam" `
            -SubscriptionId "$env:AZURE_SUBSCRIPTION_ID" `
            -DryRun
        env:
          SYNAPSE_SQL_ADMIN_PASSWORD: ${{ secrets.SYNAPSE_SQL_ADMIN_PASSWORD || secrets.repository_SYNAPSE_SQL_ADMIN_PASSWORD }}
# End of reusable workflow.
      - name: Deploy / redeploy package
        id: deploy_infra
        shell: pwsh
        run: |
          ./scripts/Deploy-SynapseWorkspace.ps1 `
            -ResourceGroupName "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -DeploymentName "synapse-${{ inputs.environment }}" `
            -TemplateFile "${{ github.workspace }}/package-extracted/infra/main.bicep" `
            -TemplateParametersFile "${{ github.workspace }}/package-extracted/infra/parameters/${{ inputs.environment }}.bicepparam" `
            -SubscriptionId "$env:AZURE_SUBSCRIPTION_ID"
        env:
          SYNAPSE_SQL_ADMIN_PASSWORD: ${{ secrets.SYNAPSE_SQL_ADMIN_PASSWORD || secrets.repository_SYNAPSE_SQL_ADMIN_PASSWORD }}

      - name: Resolve deployed workspace
        id: workspace
        shell: pwsh
        run: |
          ./scripts/Get-SynapseDeploymentOutputs.ps1 `
            -ResourceGroupName "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -DeploymentName "synapse-${{ inputs.environment }}" `
            -SubscriptionId "$env:AZURE_SUBSCRIPTION_ID"

      - name: Ensure private endpoints and DNS
        shell: pwsh
        env:
          RUNNER_RESOURCE_GROUP: ${{ vars.RUNNER_RESOURCE_GROUP }}
          ENVIRONMENT_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          WORKSPACE_NAME: ${{ steps.workspace.outputs.synapseWorkspaceName }}
        run: |
          ./scripts/Set-SynapsePrivateConnectivity.ps1 -RunnerResourceGroup $env:RUNNER_RESOURCE_GROUP `
            -EnvironmentResourceGroup $env:ENVIRONMENT_RESOURCE_GROUP `
            -EnvironmentName $env:DEPLOYMENT_ENVIRONMENT -WorkspaceName $env:WORKSPACE_NAME

      - name: Verify environment private path
        shell: pwsh
        env:
          WORKSPACE_NAME: ${{ steps.workspace.outputs.synapseWorkspaceName }}
          STORAGE_ACCOUNT_NAME: ${{ steps.workspace.outputs.storageAccountName }}
        run: |
          ./scripts/Test-RunnerPrivateConnectivity.ps1 -StorageAccountName $env:STORAGE_ACCOUNT_NAME -WorkspaceName $env:WORKSPACE_NAME
