##
# Validation (build/lint) pipeline for the Synapse PoC.
#
# Runs on pull requests and pushes to main; delegates the offline,
# credential-free checks to scripts/Test-SynapseRepository.ps1. Mirrors
# the GitHub Actions validate.yml workflow. Kept deliberately thin.
##
trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Run Test-SynapseRepository.ps1
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/scripts/Test-SynapseRepository.ps1
      arguments: >-
        -RepositoryRoot "$(Build.SourcesDirectory)"
        -RequiredPaths infra,synapse,config,scripts
        -ConfigFiles config/dev.json,config/test.json,config/prod.json
        -Offline
      pwsh: true

  - pwsh: |
      foreach ($template in @('infra/runner/main.bicep', 'infra/runner/connectivity.bicep')) {
        az bicep build --file $template --outfile "$(Agent.TempDirectory)/$([IO.Path]::GetFileNameWithoutExtension($template)).json"
        if ($LASTEXITCODE -ne 0) { throw "Bicep compilation failed: $template" }
      }
    displayName: Compile runner infrastructure

  - pwsh: |
      ./tests/Test-RunnerInfrastructure.ps1 -CompiledRunnerTemplate "$(Agent.TempDirectory)/main.json" `
        -CompiledConnectivityTemplate "$(Agent.TempDirectory)/connectivity.json"
      ./tests/Test-AzureDevOpsPipelines.ps1
    displayName: Validate private agent orchestration and topology
