##
# Reusable deployment/rollback stage template (dev/test/prod).
#
# Keeps azure-pipelines/deploy.yml and azure-pipelines/rollback.yml thin:
# all environment wiring lives here; all deployment logic lives in
# scripts/Deploy-SynapseWorkspace.ps1, scripts/Invoke-SynapseRollback.ps1 and
# scripts/Test-SynapseRepository.ps1 (owned by the scripts/ workstream).
#
# Azure authentication uses the pipeline's Azure Resource Manager service
# connection configured for Workload Identity Federation (OIDC) - no
# client secret is stored or referenced anywhere in this repo.
# `addSpnToEnvironment: true` only exposes the short-lived federated
# token/app id for the duration of the task; it is not a secret we manage.
#
# Approvals for test/prod and the "exclusive lock" (only one deployment
# running at a time per environment) are configured on the Azure DevOps
# **Environment** resource itself (Pipelines > Environments > <name> >
# Approvals and checks) - this template only references the environment
# by name via the `environment:` property below.
#
##
parameters:
  - name: stageName # unique stage identifier, e.g. Deploy_Dev / Rollback_Prod
    type: string
  - name: displayName # human readable stage/job display name
    type: string
  - name: environmentName # dev | test | prod - must match an ADO Environment name
    type: string
  - name: serviceConnection # name of the WIF-based ARM service connection
    type: string
  - name: agentPool
    type: string
  - name: resourceGroupName
    type: string
  - name: subscriptionId
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: isRollback
    type: boolean
    default: false
  - name: packageVersion
    type: string
  - name: downloadMode # 'current' (same-run artifact) or 'specific' (prior run, for rollback)
    type: string
    default: current
  - name: sourceBuildId # required when downloadMode == 'specific'
    type: string
    default: ''
  - name: pipelineResourceAlias # name/ID of the Deploy pipeline definition to pull a specific prior run from, required when downloadMode == 'specific'
    type: string
    default: ''
  - name: artifactName
    type: string
    default: synapse-infra-release

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    lockBehavior: sequential
    variables:
      expectedPackageVersion: ${{ parameters.packageVersion }}
    jobs:
      - deployment: Deploy
        displayName: ${{ parameters.displayName }}
        environment: ${{ parameters.environmentName }}
        timeoutInMinutes: 90
        variables:
          packageRoot: $(Agent.TempDirectory)\synapse-infra-$(Build.BuildId)-$(System.JobId)-$(System.JobAttempt)
        pool:
          name: ${{ parameters.agentPool }}
          demands:
            - Agent.OS -equals Windows_NT
            - Agent.OSArchitecture -equals X64
            - SYNAPSE_PRIVATE_AGENT -equals true
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                  clean: true

                - pwsh: |
                    if (Test-Path -LiteralPath "$(packageRoot)") { throw 'Job package directory already exists; retry as a new job attempt.' }
                    New-Item -ItemType Directory -Path "$(packageRoot)" | Out-Null
                  displayName: Create isolated package workspace

                - ${{ if eq(parameters.downloadMode, 'current') }}:
                    - task: DownloadPipelineArtifact@2
                      displayName: Download immutable infra release package (current run)
                      inputs:
                        source: current
                        artifact: ${{ parameters.artifactName }}
                        path: $(packageRoot)\download

                - ${{ if eq(parameters.downloadMode, 'specific') }}:
                    - task: DownloadPipelineArtifact@2
                      displayName: Download immutable infra release package (prior run)
                      inputs:
                        source: specific
                        project: $(System.TeamProject)
                        pipeline: ${{ parameters.pipelineResourceAlias }}
                        runVersion: specific
                        runId: ${{ parameters.sourceBuildId }}
                        artifact: ${{ parameters.artifactName }}
                        path: $(packageRoot)\download

                - task: PowerShell@2
                  displayName: Select and expand release package
                  inputs:
                    targetType: filePath
                    filePath: $(Build.SourcesDirectory)\scripts\Expand-SynapsePipelinePackage.ps1
                    arguments: >-
                      -PackageDirectory "$(packageRoot)\download"
                      -DestinationDirectory "$(packageRoot)\extracted"
                      -ExpectedVersion "$(expectedPackageVersion)"
                    pwsh: true

                - task: PowerShell@2
                  displayName: Verify package integrity
                  inputs:
                    targetType: filePath
                    filePath: $(Build.SourcesDirectory)\scripts\Test-SynapseRepository.ps1
                    arguments: >-
                      -RepositoryRoot "$(Build.SourcesDirectory)"
                      -ArtifactManifestPath "$(manifestPath)"
                      -ArtifactBasePath "$(packageRoot)\extracted"
                      -Offline
                    pwsh: true

                - ${{ if eq(parameters.isRollback, true) }}:
                    - task: AzureCLI@2
                      displayName: Select and verify rollback candidate
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: scriptPath
                        scriptPath: $(Build.SourcesDirectory)\scripts\Invoke-SynapseRollback.ps1
                        arguments: >-
                          -PackageDirectory "$(packageRoot)\download"
                          -ArtifactBasePath "$(packageRoot)\extracted"
                          -TargetVersion "$(expectedPackageVersion)"
                        addSpnToEnvironment: true

                - ${{ if eq(parameters.isRollback, false) }}:
                    - task: AzureCLI@2
                      displayName: Pre-deployment what-if validation
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: scriptPath
                        scriptPath: $(Build.SourcesDirectory)\scripts\Deploy-SynapseWorkspace.ps1
                        arguments: >-
                          -ResourceGroupName "${{ parameters.resourceGroupName }}"
                          -DeploymentName "synapse-${{ parameters.environmentName }}"
                          -TemplateFile "$(packageRoot)\extracted\infra\main.bicep"
                          -TemplateParametersFile "$(packageRoot)\extracted\infra\parameters\${{ parameters.environmentName }}.bicepparam"
                          -SubscriptionId "${{ parameters.subscriptionId }}"
                          -DryRun
                        addSpnToEnvironment: true
                      env:
                        SYNAPSE_SQL_ADMIN_PASSWORD: $(sqlAdministratorPassword.${{ parameters.environmentName }})

                - task: AzureCLI@2
                  displayName: Deploy or redeploy package
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Deploy-SynapseWorkspace.ps1
                    arguments: >-
                      -ResourceGroupName "${{ parameters.resourceGroupName }}"
                      -DeploymentName "synapse-${{ parameters.environmentName }}"
                      -TemplateFile "$(packageRoot)\extracted\infra\main.bicep"
                      -TemplateParametersFile "$(packageRoot)\extracted\infra\parameters\${{ parameters.environmentName }}.bicepparam"
                      -SubscriptionId "${{ parameters.subscriptionId }}"
                    addSpnToEnvironment: true
                  env:
                    SYNAPSE_SQL_ADMIN_PASSWORD: $(sqlAdministratorPassword.${{ parameters.environmentName }})

                - task: AzureCLI@2
                  displayName: Resolve deployed workspace
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Get-SynapseDeploymentOutputs.ps1
                    arguments: >-
                      -ResourceGroupName "${{ parameters.resourceGroupName }}"
                      -DeploymentName "synapse-${{ parameters.environmentName }}"
                      -SubscriptionId "${{ parameters.subscriptionId }}"

                - task: AzureCLI@2
                  displayName: Ensure private endpoints and DNS
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Set-SynapsePrivateConnectivity.ps1
                    arguments: >-
                      -RunnerResourceGroup "$(runnerResourceGroup)"
                      -EnvironmentResourceGroup "${{ parameters.resourceGroupName }}"
                      -EnvironmentName "${{ parameters.environmentName }}"
                      -WorkspaceName "$(synapseWorkspaceName)"

                - task: AzureCLI@2
                  displayName: Verify environment private path
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: pscore
                    scriptLocation: scriptPath
                    scriptPath: $(Build.SourcesDirectory)\scripts\Test-RunnerPrivateConnectivity.ps1
                    arguments: >-
                      -StorageAccountName "$(storageAccountName)"
                      -WorkspaceName "$(synapseWorkspaceName)"

                - pwsh: |
                    if (Test-Path -LiteralPath "$(packageRoot)") { Remove-Item -LiteralPath "$(packageRoot)" -Recurse -Force }
                  displayName: Clean job package workspace
                  condition: always()
