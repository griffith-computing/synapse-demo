##
# Validation (build/lint) workflow for the Synapse PoC.
#
# Runs on pull requests and pushes to main. Performs the offline,
# credential-free "Build/lint" stage described in
# docs/deployment-runbook.md: verifies the expected repository layout,
# confirms config/*.json parses and contains no obvious hard-coded
# secrets, and (when an artifact manifest is supplied, e.g. by
# deploy.yml) verifies package checksums. No Azure sign-in is performed
# here - see deploy.yml for the offline what-if + live deploy stages.
#
# ASSUMPTION: scripts/Test-SynapseRepository.ps1 is the validation entry
# point owned by the scripts/ workstream, with the parameters used below
# (-RepositoryRoot, -RequiredPaths, -ConfigFiles, -Offline). This file
# only orchestrates; no script logic lives here.
##
name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one validation run per ref at a time; superseded runs are cancelled.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Test-SynapseRepository.ps1
        shell: pwsh
        run: |
          ./scripts/Test-SynapseRepository.ps1 -RepositoryRoot "${{ github.workspace }}" -RequiredPaths infra,synapse,config,scripts -ConfigFiles config/dev.json,config/test.json,config/prod.json -Offline
