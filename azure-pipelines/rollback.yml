##
# Manual infrastructure rollback pipeline: redeploys a previously published
# immutable infra release package from a prior run of the Deploy pipeline to a
# chosen environment, without rebuilding. Delegates to the shared
# templates/deploy-stage.yml template with isRollback=true so
# scripts/Invoke-SynapseRollback.ps1 verifies/selects the package before
# scripts/Deploy-SynapseWorkspace.ps1 redeploys it. Synapse workspace
# artifacts are rolled back independently by rollback-artifacts.yml.
#
# Run this pipeline manually (Run pipeline) and supply:
#   - targetEnvironment: dev | test | prod
#   - sourceRunId: the Azure DevOps run/build ID of the Deploy pipeline
#     run that published the artifact you want to roll back to
#   - packageVersion: the version encoded in that artifact (e.g.
#     12345-abc1234, matching the Build.BuildId-shortSha value computed
#     by deploy.yml's Package stage for that run)
#
# ASSUMPTION: the Deploy pipeline (azure-pipelines/deploy.yml) has a numeric
# pipeline definition ID configured below. Replace the placeholder after
# registering the pipeline.
##
trigger: none
pr: none

parameters:
  - name: targetEnvironment
    displayName: Environment to roll back
    type: string
    default: dev
    values:
      - dev
      - test
      - prod
  - name: sourceRunId
    displayName: Deploy pipeline run ID to roll back to
    type: string
  - name: packageVersion
    displayName: Package version to roll back to (e.g. 12345-abc1234)
    type: string

pool:
  vmImage: ubuntu-latest

variables:
  - template: templates/variables.yml
  - name: deployPipelineId
    value: '0'

stages:
  - ${{ if eq(parameters.targetEnvironment, 'dev') }}:
      - template: templates/deploy-stage.yml
        parameters:
          stageName: Rollback_Dev
          displayName: Rollback - dev
          environmentName: dev
          serviceConnection: $(serviceConnection.dev)
          resourceGroupName: $(resourceGroup.dev)
          subscriptionId: $(subscriptionId.dev)
          artifactName: $(releaseArtifactName)
          packageVersion: ${{ parameters.packageVersion }}
          isRollback: true
          downloadMode: specific
          sourceBuildId: ${{ parameters.sourceRunId }}
          pipelineResourceAlias: $(deployPipelineId)

  - ${{ if eq(parameters.targetEnvironment, 'test') }}:
      - template: templates/deploy-stage.yml
        parameters:
          stageName: Rollback_Test
          displayName: Rollback - test
          environmentName: test
          serviceConnection: $(serviceConnection.test)
          resourceGroupName: $(resourceGroup.test)
          subscriptionId: $(subscriptionId.test)
          artifactName: $(releaseArtifactName)
          packageVersion: ${{ parameters.packageVersion }}
          isRollback: true
          downloadMode: specific
          sourceBuildId: ${{ parameters.sourceRunId }}
          pipelineResourceAlias: $(deployPipelineId)

  - ${{ if eq(parameters.targetEnvironment, 'prod') }}:
      - template: templates/deploy-stage.yml
        parameters:
          stageName: Rollback_Prod
          displayName: Rollback - prod
          environmentName: prod
          serviceConnection: $(serviceConnection.prod)
          resourceGroupName: $(resourceGroup.prod)
          subscriptionId: $(subscriptionId.prod)
          artifactName: $(releaseArtifactName)
          packageVersion: ${{ parameters.packageVersion }}
          isRollback: true
          downloadMode: specific
          sourceBuildId: ${{ parameters.sourceRunId }}
          pipelineResourceAlias: $(deployPipelineId)
